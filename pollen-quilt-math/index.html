<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pollen Quilt Math</title>
<style>
@font-face{font-family:'Fredoka';font-weight:300 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:200 1000;font-display:swap;src:url(fonts/nunito.woff2) format('woff2')}
:root{--bg:#f3f6ee;--panel:#fff;--ink:#26301f;--muted:#6c7863;--line:#d9e1cf;--accent:#e7a520;--good:#5aa846;--empty:#e4eadb;
  --display:"Fredoka","Trebuchet MS",sans-serif;--body:"Nunito",system-ui,sans-serif}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:2px solid var(--line);background:var(--panel);border-radius:999px}
[hidden]{display:none!important}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;padding:12px 14px;box-sizing:border-box;overflow-y:auto}

/* start */
#start{justify-content:center;text-align:center}
.logo{font-family:var(--display);font-weight:700;font-size:54px;line-height:.95;margin:0 0 6px}
.logo span{display:block;color:var(--accent)}
.logo small{display:block;font-size:30px;color:#3f7fc4;margin-top:4px}
.big{font-size:34px;font-weight:600;padding:16px 56px;background:var(--accent);border-color:var(--accent);margin:22px 0 8px}
.big:active{transform:scale(.95)}
.sub{color:var(--muted);font-size:17px;margin:0}
.link{margin-top:18px;font-size:20px;padding:10px 26px}

/* gallery */
#gallery h2{font-family:var(--display);font-size:30px;margin:6px 0 10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));grid-gap:12px;width:100%;max-width:720px}
.thumb{border-radius:14px;padding:6px;font-size:13px;line-height:1.2;font-family:var(--body);font-weight:700}
.thumb canvas{display:block;width:100%;border-radius:8px;image-rendering:pixelated;margin-bottom:4px}
.thumb.locked{opacity:.35}
.thumb.now{border-color:var(--accent);border-width:3px}

/* game */
.top{width:100%;max-width:680px;display:flex;align-items:center;justify-content:space-between}
.top button{font-size:18px;padding:8px 18px}
.top .meta{font-family:var(--display);font-size:20px;color:var(--muted)}
.quilt{display:grid;grid-template-columns:repeat(10,1fr);grid-gap:3px;background:var(--line);padding:7px;border-radius:14px;
  width:min(88vw,40vh);margin:10px 0;box-sizing:border-box}
.cell{padding-top:100%;border-radius:4px;background:var(--empty);position:relative}
.cell.next{box-shadow:inset 0 0 0 2px #6c786366}
.cell.on{background:var(--c);animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.problem{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;margin:4px 0 6px;letter-spacing:2px}
.problem .q{color:var(--accent)}
.count{display:flex;align-items:center;justify-content:center;min-height:96px;margin-bottom:6px}
.frame{display:grid;grid-gap:4px}
.plus{font-family:var(--display);font-size:40px;font-weight:700;margin:0 14px;color:var(--muted)}
.cnt{width:var(--cw,34px);height:var(--cw,34px);background:center/contain no-repeat;background-image:var(--img)}
.answers{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:16px;width:min(92vw,560px);margin-top:6px}
.answers button{font-size:56px;font-weight:700;padding:14px 0;border-width:4px;border-radius:24px;background:#fff}
.answers button:active{transform:scale(.94)}
.answers button.right{background:var(--good);border-color:var(--good);color:#fff}
.answers button.wrong{opacity:.3;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.cheer{font-family:var(--display);font-size:26px;height:34px;margin-top:10px;color:var(--good)}
.cheer.try{color:#c8453a}

/* done */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:5}
.card{background:var(--panel);border-radius:24px;padding:24px 28px;text-align:center;max-width:90vw}
.card h2{font-family:var(--display);font-size:38px;margin:0 0 8px}
.card canvas{width:200px;height:200px;image-rendering:pixelated;border-radius:12px;display:block;margin:6px auto 14px}
.card .big{margin:6px 0 0}

/* pollen mist */
.puff{position:fixed;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;
  background:radial-gradient(circle,var(--c) 0,transparent 70%);opacity:.55;pointer-events:none;animation:puff .6s ease-out forwards;z-index:4}
@keyframes puff{from{transform:scale(.3)}to{transform:scale(1);opacity:0}}
.speck{position:fixed;width:var(--z);height:var(--z);border-radius:50%;background:var(--c);pointer-events:none;z-index:4;animation:speck .7s ease-out forwards}
@keyframes speck{to{transform:translate(var(--dx),var(--dy));opacity:0}}

@media (max-height:700px){.problem{font-size:46px}.answers button{font-size:40px;padding:8px 0}.count{min-height:76px}.count{--cw:26px}.cnt{width:26px;height:26px}}
@media (min-height:900px){.count{--cw:58px;min-height:130px}.frame{grid-gap:8px}.plus{font-size:56px;margin:0 24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quilt Math">
<meta name="theme-color" content="#f3f6ee">
</head>
<body>

<div class="screen" id="start">
  <h1 class="logo">Pollen<span>Quilt</span><small>Math</small></h1>
  <p class="sub">Add the bees to stitch a picture!</p>
  <button class="big" id="play" type="button">Play</button>
  <p class="sub" id="progress"></p>
  <button class="link" id="pick" type="button">Pick a picture</button>
</div>

<div class="screen" id="gallery" hidden>
  <div class="top"><button id="galBack" type="button">Back</button><span></span></div>
  <h2>Pick a picture</h2>
  <div class="thumbs" id="thumbs"></div>
</div>

<div class="screen" id="game" hidden>
  <div class="top"><button id="menu" type="button">Menu</button><span class="meta" id="meta"></span></div>
  <div class="quilt" id="quilt"></div>
  <div class="problem" id="problem"></div>
  <div class="count" id="count"></div>
  <div class="answers" id="answers"></div>
  <div class="cheer" id="cheer"></div>
</div>

<div class="overlay" id="done" hidden>
  <div class="card">
    <h2 id="doneTitle"></h2>
    <canvas id="doneArt" width="10" height="10"></canvas>
    <button class="big" id="next" type="button">Next picture</button>
  </div>
</div>

<script src="pictures.js"></script>
<script>
const PAL={'.':'#9fd3ea','~':'#3f7fc4','r':'#e0534a','y':'#f5c531','g':'#5aa846','w':'#f7f4ea','c':'#e9d2a6','k':'#3b3b46',
  'b':'#8a5a35','p':'#d77fc0','o':'#f08a2c','n':'#2f7a3e','v':'#8e6cc9','h':'#f2c29b','a':'#a7adb3','l':'#f6c3d8','t':'#3fbfb0'};
const $=id=>document.getElementById(id);
const N=PICTURES.length, ROWS=10;
const CHEERS=['Great job!','You got it!','Super!','Buzz-tastic!','Yay!','Awesome!','Sweet as honey!'];

// ---- saved progress ----
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:+v}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let level=Math.min(get('pqm-level',0),N-1), best=Math.max(level,Math.min(get('pqm-best',0),N-1));

// ---- tinted bee counters ----
let beeUrl='';
{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
  x.fillStyle='#f5c531';x.fillRect(0,0,96,96);x.globalCompositeOperation='multiply';x.drawImage(im,0,0,96,96);
  x.globalCompositeOperation='destination-in';x.drawImage(im,0,0,96,96);
  try{beeUrl=`url(${c.toDataURL()})`}catch(e){beeUrl=`url(bee.png)`}
  document.documentElement.style.setProperty('--img',beeUrl)};im.src='bee.png';}

// ---- drawing helpers ----
function drawArt(cv,art){const x=cv.getContext('2d');cv.width=cv.height=10;
  art.forEach((row,r)=>[...row].forEach((ch,c)=>{x.fillStyle=PAL[ch];x.fillRect(c,r,1,1)}))}

function show(id){['start','gallery','game'].forEach(s=>$(s).hidden=s!==id)}

function startScreen(){
  $('progress').textContent=level>0?`Picture ${level+1} of ${N}`:`${N} pictures to stitch`;
  show('start');
}

function gallery(){
  const t=$('thumbs');t.innerHTML='';
  PICTURES.forEach((p,i)=>{
    const b=document.createElement('button');b.type='button';b.className='thumb'+(i>best?' locked':'')+(i===level?' now':'');
    const cv=document.createElement('canvas');
    if(i<best||(i===best&&get('pqm-done-'+i,0)))drawArt(cv,p.art);
    else{cv.width=cv.height=10;const x=cv.getContext('2d');x.fillStyle='#e4eadb';x.fillRect(0,0,10,10)}
    b.appendChild(cv);b.appendChild(document.createTextNode(i<=best?`${i+1}. ${p.name}`:`${i+1}`));
    if(i<=best)b.onclick=()=>startLevel(i);else b.disabled=true;
    t.appendChild(b)});
  show('gallery');
  const now=t.children[level];if(now&&now.scrollIntoView)now.scrollIntoView({block:'center'});
}

// ---- problems: sums grow with the picture number, never above 20 ----
function maxSum(li){return li<15?5:li<30?10:li<50?15:20}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
let lastQ='';
function makeProblem(li){
  const top=maxSum(li);let a,b;
  do{const s=rnd(li<15?2:Math.max(3,top-8),top);a=li<15?rnd(1,s-1):rnd(0,s);b=s-a;
     if(li>=15&&(a===0||b===0)&&Math.random()<.7)continue;}
  while(`${a}+${b}`===lastQ||a>10||b>10);
  lastQ=`${a}+${b}`;
  const ans=a+b,opts=new Set([ans]);
  while(opts.size<3){const d=ans+rnd(-3,3);if(d>=0&&d<=20&&d!==ans)opts.add(d)}
  return {a,b,ans,opts:[...opts].sort(()=>Math.random()-.5)};
}

// ---- game ----
let S=null;
function startLevel(li){
  level=li;put('pqm-level',li);
  const p=PICTURES[li];
  S={li,art:p.art,rows:0,busy:false};
  const q=$('quilt');q.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<10;c++){const d=document.createElement('div');d.className='cell';d.style.setProperty('--c',PAL[p.art[r][c]]);q.appendChild(d)}
  $('meta').textContent=`Picture ${li+1} of ${N}`;
  show('game');markNext();ask();
}
function cellsOfRow(r){return [...$('quilt').children].slice(r*10,r*10+10)}
function markNext(){
  document.querySelectorAll('.cell.next').forEach(e=>e.classList.remove('next'));
  if(S.rows<ROWS)[ROWS-1-S.rows,ROWS-2-S.rows].forEach(r=>{if(r>=0)cellsOfRow(r).forEach(e=>e.classList.add('next'))});
}
function counters(n){const f=document.createElement('div');f.className='frame';f.style.gridTemplateColumns=`repeat(${Math.max(1,Math.min(n,5))},var(--cw,34px))`;
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='cnt';f.appendChild(e)}return f}
function ask(){
  const P=makeProblem(S.li);S.P=P;S.busy=false;
  $('problem').innerHTML=`${P.a} + ${P.b} = <span class="q">?</span>`;
  const c=$('count');c.innerHTML='';c.appendChild(counters(P.a));
  const pl=document.createElement('span');pl.className='plus';pl.textContent='+';c.appendChild(pl);c.appendChild(counters(P.b));
  const A=$('answers');A.innerHTML='';
  P.opts.forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent=v;b.onclick=()=>answer(b,v);A.appendChild(b)});
  $('cheer').textContent='';$('cheer').className='cheer';
}
function answer(btn,v){
  if(S.busy||btn.classList.contains('wrong'))return;
  if(v!==S.P.ans){btn.classList.add('wrong');$('cheer').textContent='Try again! Count the bees.';$('cheer').className='cheer try';return}
  S.busy=true;btn.classList.add('right');
  $('problem').innerHTML=`${S.P.a} + ${S.P.b} = <span style="color:var(--good)">${S.P.ans}</span>`;
  $('cheer').textContent=CHEERS[rnd(0,CHEERS.length-1)];$('cheer').className='cheer';
  stitch();
}
function stitch(){
  const rows=[ROWS-1-S.rows,ROWS-2-S.rows].filter(r=>r>=0);S.rows+=2;
  document.querySelectorAll('.cell.next').forEach(e=>e.classList.remove('next'));
  let k=0;
  rows.forEach(r=>cellsOfRow(r).forEach(e=>{const d=k++*45;setTimeout(()=>{e.classList.add('on');mist(e,e.style.getPropertyValue('--c'))},d)}));
  setTimeout(()=>{if(S.rows>=ROWS)finish();else{markNext();ask()}},k*45+700);
}
function finish(){
  put('pqm-done-'+S.li,1);
  if(S.li+1>best){best=Math.min(S.li+1,N-1);put('pqm-best',best)}
  if(S.li+1<N)put('pqm-level',S.li+1);
  $('doneTitle').textContent=`You made a ${PICTURES[S.li].name}!`;
  drawArt($('doneArt'),S.art);
  $('next').textContent=S.li+1<N?'Next picture':'Play again';
  $('done').hidden=false;
}
$('next').onclick=()=>{$('done').hidden=true;startLevel(S.li+1<N?S.li+1:0)};

// ---- pollen mist ----
function mist(el,hex){
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const p=document.createElement('div');p.className='puff';p.style.cssText=`left:${cx}px;top:${cy}px;--c:${hex};--s:${Math.max(r.width,14)*2.4}px`;
  document.body.appendChild(p);setTimeout(()=>p.remove(),650);
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='speck';const a=Math.random()*6.28,dist=r.width*(.8+Math.random());
    d.style.cssText=`left:${cx}px;top:${cy}px;--c:${hex};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist}px;--z:${(2+Math.random()*3).toFixed(1)}px`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),750)}
}

$('play').onclick=()=>startLevel(level);
$('pick').onclick=gallery;
$('galBack').onclick=startScreen;
$('menu').onclick=startScreen;
startScreen();
</script>
<script src="sw-register.js"></script>
</body>
</html>
