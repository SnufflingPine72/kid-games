<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hoppity Lanes</title>
<style>
@font-face{font-family:'Fredoka';font-weight:300 700;font-display:swap;src:url(fonts/fredoka.woff2) format('woff2')}
:root{--bg:#8fd16a;--ink:#26301f;--panel:#fff;--line:#d9e1cf;--accent:#f5a623;--display:"Fredoka","Trebuchet MS",sans-serif}
html,body{margin:0;height:100%;background:#7cc35a;color:var(--ink);font-family:var(--display);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:4px solid #26301f;background:var(--panel);border-radius:18px;box-shadow:0 6px 0 #26301f}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #26301f}
[hidden]{display:none!important}
.screen{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:12px}

/* start */
#start{justify-content:center;text-align:center;background:linear-gradient(#9fdcff,#bfe9ff 45%,#8fd16a 45%,#7cc35a)}
.logo{font-weight:700;font-size:64px;line-height:.9;margin:0;color:#fff;text-shadow:0 5px 0 #26301f,3px 0 0 #26301f,-3px 0 0 #26301f,0 -3px 0 #26301f}
.logo span{display:block;color:#ffd23f}
#hero{width:200px;height:200px;margin:14px 0 6px;image-rendering:pixelated}
.btns{display:grid;grid-gap:14px;width:min(80vw,380px);margin-top:8px}
.big{font-size:34px;font-weight:700;padding:12px 0;background:#ffd23f}
.kid{font-size:26px;font-weight:600;padding:10px 0;background:#b6f0a0}
.mid{font-size:22px;padding:8px 0}
.coinpill{display:inline-block;background:#fff;border:3px solid #26301f;border-radius:999px;padding:4px 16px;font-size:22px;font-weight:600}
.coinpill i{display:inline-block;width:16px;height:16px;background:#ffd23f;border:3px solid #c48a00;border-radius:50%;vertical-align:-2px;margin-right:6px}
.best{font-size:18px;color:#26301f;margin-top:10px}

/* characters */
#chars{background:#bfe9ff}
#chars h2{font-size:34px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-gap:12px;width:100%;max-width:760px;overflow-y:auto;padding:4px 4px 20px;box-sizing:border-box}
.card{border-radius:16px;padding:8px 6px;font-size:16px;line-height:1.15;box-shadow:0 4px 0 #26301f}
.card canvas{width:72px;height:72px;display:block;margin:0 auto 4px;image-rendering:pixelated}
.card.sel{background:#ffd23f}
.card.locked canvas{filter:brightness(0)}
.card b{display:block;font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:760px}
.row button{font-size:20px;padding:6px 16px}

/* game */
#game{padding:0;background:#3d8f3a}
.hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}
.hud .score{font-size:52px;font-weight:700;color:#fff;text-shadow:0 4px 0 #26301f,2px 0 0 #26301f,-2px 0 0 #26301f}
.hud .right{display:flex;flex-direction:column;align-items:flex-end}
.hud button{pointer-events:auto;font-size:18px;padding:4px 14px;margin-bottom:6px}
.hearts{font-size:30px;letter-spacing:2px;margin-top:4px}
#cv{display:block;flex:none;image-rendering:pixelated}
.pad{display:grid;grid-template-columns:1fr 1.4fr 1fr;grid-gap:12px;width:100%;max-width:640px;padding:10px 12px 14px;box-sizing:border-box;background:#2f6e2d}
.pad button{font-size:46px;height:96px;line-height:1;padding:0}
.pad .up{background:#ffd23f}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-size:44px;font-weight:700;color:#fff;text-shadow:0 4px 0 #26301f;pointer-events:none;white-space:nowrap}

.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:5}
.card2{background:#fff;border:4px solid #26301f;border-radius:24px;padding:22px 28px;text-align:center;min-width:280px;box-shadow:0 8px 0 #26301f}
.card2 h2{font-size:42px;margin:0}
.card2 p{font-size:22px;margin:8px 0}
.card2 .btns{margin:14px auto 0}
@media (max-height:760px){.pad button{height:70px;font-size:34px}.logo{font-size:48px}#hero{width:140px;height:140px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hoppity">
<meta name="theme-color" content="#9fdcff">
</head>
<body>

<div class="screen" id="start">
  <span class="coinpill"><i></i><span id="coinsS">0</span></span>
  <h1 class="logo">Hoppity<span>Lanes</span></h1>
  <canvas id="hero" width="80" height="80"></canvas>
  <div class="btns">
    <button class="big" id="playReg" type="button">Play</button>
    <button class="kid" id="playKid" type="button">Lincoln mode</button>
    <button class="mid" id="openChars" type="button">Characters</button>
    <button class="mid" id="sound" type="button">Sound: on</button>
  </div>
  <div class="best" id="bests"></div>
</div>

<div class="screen" id="chars" hidden>
  <div class="row"><button id="charsBack" type="button">Back</button><span class="coinpill"><i></i><span id="coinsC">0</span></span></div>
  <h2>Characters</h2>
  <div class="grid" id="grid"></div>
</div>

<div class="screen" id="game" hidden>
  <div class="hud">
    <div><div class="score" id="score">0</div><div class="hearts" id="hearts"></div></div>
    <div class="right"><button id="quit" type="button">Menu</button><span class="coinpill"><i></i><span id="coinsG">0</span></span></div>
  </div>
  <canvas id="cv"></canvas>
  <div class="toast" id="toast" hidden></div>
  <div class="pad">
    <button id="bL" type="button" aria-label="Left">◀</button>
    <button id="bU" class="up" type="button" aria-label="Hop forward">▲</button>
    <button id="bR" type="button" aria-label="Right">▶</button>
  </div>
</div>

<div class="overlay" id="over" hidden>
  <div class="card2">
    <h2 id="overTitle">Bonk!</h2>
    <p id="overText"></p>
    <div class="btns">
      <button class="big" id="again" type="button">Play again</button>
      <button class="mid" id="toMenu" type="button">Menu</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);

// ================= characters (8x8, original) =================
const CP={k:'#26262e',w:'#f7f7f2',r:'#e0443a',o:'#f08a2c',y:'#ffd23f',g:'#5cbf4a',G:'#2f7a3e',b:'#4a90e2',B:'#2c5aa0',
  p:'#f49ac1',P:'#8e5cc9',n:'#9a6236',N:'#5e3a1f',a:'#b9c0c7',A:'#6e7780',s:'#f2c29b',t:'#3fbfb0',c:'#f3dcae'};
const CHARS=[
 {name:'Bun',price:0,art:[".w....w.",".wp..pw.",".wp..pw.",".wwwwww.","wwkwwkww","wwwppwww",".wwwwww.","..w..w.."]},
 {name:'Peep',price:10,art:["...y....","..yyyy..",".ykyyky.",".yyooyy.","yyyyyyyy","yyyyyyyy",".yyyyyy.","..o..o.."]},
 {name:'Ribbit',price:10,art:["........",".gg..gg.","gwkggwkg","gggggggg","grrrrrrg","gggggggg",".gggggg.","gg....gg"]},
 {name:'Spotty',price:15,art:["..kkkk..",".kwkkwk.","rrrkkrrr","rkrrkrkr","rrrkkrrr","rkrkkrkr",".rrkkrr.","..k..k.."]},
 {name:'Buzz',price:15,art:[".k....k.","..k..k..","wwyyyyww","wykkkkyw","yyyyyyyy","kkkkkkkk",".yyyyyy.","..kkkk.."]},
 {name:'Rusty',price:20,art:["o......o","oo....oo","oooooooo","okooooko","oooooooo","wwookoww",".wwwwww.","..o..o.."]},
 {name:'Midnight',price:20,art:["k......k","kk....kk","kkkkkkkk","kykkkkyk","kkkppkkk","kkkkkkkk",".kkkkkk.","..k..k.."]},
 {name:'Biscuit',price:25,art:["nn....nn","nnccccnn","nckcckcn",".cccccc.",".cckkcc.","..cppc..","..cccc..",".n....n."]},
 {name:'Bamboo',price:25,art:["kk....kk",".wwwwww.","wkkwwkkw","wwwwwwww","wwwkkwww",".wwwwww.","kkwwwwkk",".kk..kk."]},
 {name:'Waddles',price:30,art:["..kkkk..",".kkkkkk.",".kwkkwk.",".kwoowk.","kkwwwwkk","kkwwwwkk",".kwwwwk.","..oo.oo."]},
 {name:'Bolt',price:30,art:["...r....","...a....",".aaaaaa.",".ataata.",".akkkka.","aaaaaaaa",".ayrrya.",".a....a."]},
 {name:'Zib',price:40,art:[".g....g.","..g..g..",".gggggg.","gkkggkkg","gkwggwkg","gggggggg",".gggggg.",".g.gg.g."]},
 {name:'Chomper',price:40,art:["....ggg.","...gkggg","...ggggg","g.ggg...","gggggg..",".gggggg.","..gyyg..","..g..g.."]},
 {name:'Sparkle',price:50,art:[".y......","..y.ww..","...wwww.","..wwkwwp","wwwwwwpp","wwwwwwp.",".w.w.w..",".w.w.w.."]},
 {name:'Boo',price:50,art:["..wwww..",".wwwwww.","wwkwwkww","wwkwwkww","wwwwwwww","wwwppwww","wwwwwwww","w.ww.ww."]},
 {name:'Jack',price:60,art:["...G....","...G....",".oooooo.","ookookoo","oooooooo","ookkkkoo",".oooooo.","..oooo.."]},
 {name:'Cosmo',price:75,art:[".aaaaaa.","aawwwwaa","awbbbbwa","awbtbbwa","aawwwwaa",".wwwwww.","wwrwwbww",".ww..ww."]},
 {name:'Sir Hops',price:90,art:["..aaaa..",".aaaaaa.",".akkkka.",".aaaaaa.","rraaaarr","raaaaaar",".aaaaaa.",".nn..nn."]},
 {name:'Merlin',price:100,art:["...P....","..PPy...",".PPPPP..","PPPPPPPP","..skks..","..wwww..",".PPPPPP.","..n..n.."]},
 {name:'Ember',price:150,art:[".....rr.","....rkrr","r...rrrr","rr.rrr..",".rrrrrr.","yrryyrr.","..r..r..","..r..r.."]},
];

// ================= save + sound =================
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let coins=+get('hl-coins',0)||0, owned=new Set(get('hl-owned','0').split(',').map(Number)), sel=+get('hl-sel',0)||0;
let bestReg=+get('hl-best-reg',0)||0, bestKid=+get('hl-best-kid',0)||0, soundOn=get('hl-sound','1')==='1';
if(!owned.has(sel))sel=0;
function saveAll(){put('hl-coins',coins);put('hl-owned',[...owned].join(','));put('hl-sel',sel)}
let AC=null;
function tone(f,d,type,v,slide){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
// ---- background music: audio/music.wav, looped through Web Audio (gapless), quieter than effects ----
let music=null,musicSrc=null,musicLoading=false;
async function startMusic(){
  if(!soundOn||musicSrc||musicLoading)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')await AC.resume();
    if(!music){musicLoading=true;const r=await fetch('audio/music.wav');music=await AC.decodeAudioData(await r.arrayBuffer());musicLoading=false}
    if(!soundOn||musicSrc)return;
    const g=AC.createGain();g.gain.value=.35;const s=AC.createBufferSource();s.buffer=music;s.loop=true;
    s.connect(g);g.connect(AC.destination);s.start();musicSrc=s}catch(e){musicLoading=false}
}
function stopMusic(){if(musicSrc){try{musicSrc.stop()}catch(e){}musicSrc=null}}
addEventListener('pointerdown',startMusic);   // browsers only allow sound after the first tap
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
const sHop=()=>tone(440,.06,'square',.03,660);
const sCoin=()=>{tone(988,.07,'square',.04);setTimeout(()=>tone(1319,.12,'square',.04),60)};
const sSplash=()=>tone(300,.35,'sawtooth',.05,80);
const sBonk=()=>tone(180,.3,'square',.07,60);
const sDing=()=>tone(1200,.08,'triangle',.04);
const sHorn=()=>{tone(330,.4,'sawtooth',.05);tone(415,.4,'sawtooth',.04)};

// ================= colors / drawing helpers =================
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  if(f>0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f}else{r*=1+f;g*=1+f;b*=1+f}
  return '#'+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
// Character art: chars/<name>.png (48x48, feet on the bottom row) when present, else the built-in 8x8 sprite
const ART={};
CHARS.forEach((ch,i)=>{const im=new Image();im.onload=()=>{ART[i]=im;if(!$('start').hidden)startScreen();if(!$('chars').hidden)charsScreen()};
  im.src='chars/'+ch.name.toLowerCase().replace(/[^a-z]/g,'')+'.png'});
function drawChar(c,i,cx,by,size,flip,squash){
  const im=ART[i];if(!im){drawSprite(c,CHARS[i].art,cx,by,size*.82,flip,squash);return}
  const h=size*(squash||1);c.save();c.imageSmoothingEnabled=false;
  if(flip){c.translate(cx,0);c.scale(-1,1);cx=0}
  c.drawImage(im,Math.round(cx-size/2),Math.round(by-h),Math.round(size),Math.round(h));c.restore();
}
// 2.5D sprite: each pixel gets a lighter "top" rim so the character looks like a chunky block figure
function drawSprite(c,art,cx,by,size,flip,squash){
  const s=size/8,sy=s*(squash||1),x0=cx-size/2,y0=by-8*sy;
  for(let pass=0;pass<2;pass++)for(let r=0;r<8;r++)for(let q=0;q<8;q++){
    const ch=art[r][flip?7-q:q];if(ch==='.')continue;
    if(pass===0){c.fillStyle=shade(CP[ch],.35);c.fillRect(x0+q*s,y0+r*sy-sy*.45,s+.5,sy+.5)}
    else{c.fillStyle=CP[ch];c.fillRect(x0+q*s,y0+r*sy,s+.5,sy+.5)}
  }
}
// previews use whole-pixel blocks (8px per sprite pixel) so they stay crisp when scaled up
function spriteCanvas(cv,i){cv.width=cv.height=96;const c=cv.getContext('2d');c.clearRect(0,0,96,96);drawChar(c,i,48,96,96,false,1)}

// ================= world =================
const COLS=9;
let G=null;
function rand(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return Math.floor(rand(a,b+1))}
// open stretches of a grass lane, split by trees
function segments(trees){const out=[];let cur=[];for(let c=0;c<COLS;c++){if(trees.has(c)){if(cur.length)out.push(cur);cur=[]}else cur.push(c)}if(cur.length)out.push(cur);return out}
function makeLane(i,kid){
  const L=G.lanes,prev=L[i-1];
  let type;
  if(i<4)type='grass';
  else if(G.runLeft>0){type=G.runType;G.runLeft--}
  else{
    const opts=[['grass',.28],['road',.36]];
    if(i>6)opts.push(['river',.22]);if(i>10)opts.push(['rail',.14]);
    let t=Math.random()*opts.reduce((s,o)=>s+o[1],0);type=opts.find(o=>(t-=o[1])<0)[0];
    if(prev&&prev.type==='rail'&&type==='rail')type='grass';
    const len={grass:[1,2],road:[1,4],river:[1,3],rail:[1,2]}[type];
    G.runType=type;G.runLeft=ri(len[0],len[1])-1;
  }
  const d=Math.min(1,i/220),m=kid?.6:1,lane={type,i,objs:[],trees:new Set(),coin:null,shade:i%2};
  if(type==='grass'){
    const n=i<2?0:ri(0,3);
    for(let k=0;k<n;k++)lane.trees.add(ri(0,COLS-1));
    if(i<2)lane.trees.clear();
    // no dead ends: every open stretch of the grass below must have a way up into this lane
    if(prev&&prev.type==='grass'&&!segments(prev.trees).every(seg=>seg.some(c=>!lane.trees.has(c))))lane.trees.clear()
  }
  if(type==='road'){
    lane.dir=Math.random()<.5?1:-1;lane.v=lane.dir*(1.1+d*2.6+rand(0,.8))*m;
    const P=COLS+8,minGap=kid?3.4:2.4;let x=rand(-4,0);
    while(true){const len=Math.random()<.25+d*.2?2:1;if(x+len>P-4+ -minGap*0)break;
      lane.objs.push({x,len,color:['#e0443a','#4a90e2','#ffd23f','#f08a2c','#8e5cc9','#f7f7f2'][ri(0,5)],truck:len===2});
      x+=len+rand(minGap,minGap+4-d*1.5);if(lane.objs.length>=(kid?2:4))break}
  }
  if(type==='river'){
    // lily pads only after grass (walk sideways safely) or a log lane (logs drift into line)
    const pads=Math.random()<.3&&prev&&!prev.pads&&(prev.type==='grass'||prev.type==='river');
    if(pads){lane.pads=new Set();lane.type='river';lane.v=0;
      const cols=[...Array(COLS).keys()].sort(()=>Math.random()-.5);for(let k=0;k<ri(3,5);k++)lane.pads.add(cols[k]);
      // from grass, every open stretch needs a pad it can reach
      if(prev.type==='grass')for(const seg of segments(prev.trees))if(!seg.some(c=>lane.pads.has(c)))lane.pads.add(seg[ri(0,seg.length-1)])}
    else{lane.dir=prev&&prev.type==='river'&&prev.dir?-prev.dir:(Math.random()<.5?1:-1);lane.v=lane.dir*(.7+d*1.3+rand(0,.4))*m;
      let x=rand(-4,-2);const P=COLS+8;
      while(x<P-6){const len=ri(kid?3:2,kid?4:4);lane.objs.push({x,len});x+=len+rand(kid?1:1.3,kid?2:3)}}
  }
  if(type==='rail'){lane.train={state:'idle',t:rand(1.5,5)*(kid?1.6:1),x:0,len:12,dir:Math.random()<.5?1:-1}}
  if((type==='grass'||type==='road')&&i>3&&Math.random()<(type==='grass'?.6:.4)){
    let col,k=0;do{col=ri(0,COLS-1)}while(lane.trees.has(col)&&++k<20);
    if(!lane.trees.has(col))lane.coin={col,gem:Math.random()<.08,phase:Math.random()*6}}
  return lane;
}
function lane(i){while(G.lanes.length<=i)G.lanes.push(makeLane(G.lanes.length,G.kid));return G.lanes[i]}

// ================= game =================
function newGame(kid){
  G={kid,lanes:[],runType:'grass',runLeft:0,cam:0,started:false,score:0,runCoins:0,
     p:{x:4,row:0,hop:null,alive:true,face:1,invuln:0,lastSafe:0},hearts:kid?3:0,parts:[],deathT:0,over:false,shake:0};
  for(let i=0;i<30;i++)lane(i);
  show('game');updHud();layout();toast(kid?'Lincoln mode!':'Hop!');
}
function updHud(){$('score').textContent=G.score;$('coinsG').textContent=coins;
  $('hearts').textContent=G.kid?'❤'.repeat(Math.max(0,G.hearts))+'♡'.repeat(Math.max(0,3-G.hearts)):''}
let toastT=0;function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,900)}

function move(dx,dy){
  if(!G||G.over||!G.p.alive||G.p.hop)return;
  const p=G.p,col=Math.round(p.x),tc=col+dx,tr=p.row+dy;
  if(tc<0||tc>=COLS)return;
  const L=lane(tr);
  if(L.type==='grass'&&L.trees.has(tc)){G.shake=.12;return}
  if(dx)p.face=dx;
  p.hop={fx:p.x,fr:p.row,tx:tc,tr,t:0};G.started=true;sHop();
}
function land(){
  const p=G.p,L=lane(p.row);
  if(p.row>G.score){G.score=p.row;updHud()}
  if(L.coin&&L.coin.col===Math.round(p.x)){const v=L.coin.gem?5:1;coins+=v;G.runCoins+=v;L.coin=null;saveAll();sCoin();
    burst(p.x,p.row,'#ffd23f',8);updHud()}
  if(L.type==='grass')p.lastSafe=p.row;
  for(let k=p.row;k<p.row+30;k++)lane(k);
}
function die(kind){
  const p=G.p;if(!p.alive||p.invuln>0)return;
  p.alive=false;p.death=kind;G.deathT=0;G.shake=.3;
  if(kind==='splash'){sSplash();burst(p.x,p.row,'#9fd8ff',16)}
  else{sBonk();burst(p.x,p.row,'#ffffff',14)}
}
function afterDeath(){
  const p=G.p;
  if(G.kid&&--G.hearts>0){
    // put the hopper back on the last grass lane, on a free square near where they were
    const r=Math.min(p.lastSafe,p.row),L=lane(r);let c=Math.round(Math.max(0,Math.min(COLS-1,p.x)));
    for(let k=0;k<COLS&&L.trees.has(c);k++)c=(c+1)%COLS;
    Object.assign(p,{x:c,row:r,hop:null,alive:true,invuln:1.6,death:null});G.cam=Math.min(G.cam,r-1);updHud();toast('Try again!');return}
  G.over=true;updHud();
  if(G.kid){if(G.score>bestKid){bestKid=G.score;put('hl-best-kid',bestKid)}}else if(G.score>bestReg){bestReg=G.score;put('hl-best-reg',bestReg)}
  const best=G.kid?bestKid:bestReg;
  $('overTitle').textContent={splash:'Splash!',squish:'Bonk!',train:'Choo-choo!',gust:'Whoosh!',drift:'Whoops!'}[p.death]||'Bonk!';
  $('overText').innerHTML=`You hopped <b>${G.score}</b> lanes<br>Best: ${best} · Coins this run: ${G.runCoins}`;
  $('over').hidden=false;
}
function burst(x,row,col,n){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(1.5,4);G.parts.push({x:x+.5,row:row+.4,vx:Math.cos(a)*s,vy:Math.sin(a)*s+2,life:rand(.4,.8),c:col})}}

function update(dt){
  if(!G||G.over)return;
  const p=G.p;
  // move lane objects
  const lo=Math.floor(G.cam)-2,hi=Math.floor(G.cam)+VIS+2;
  for(let i=Math.max(0,lo);i<=hi;i++){const L=lane(i);
    if(L.v){const P=COLS+8;for(const o of L.objs){o.x+=L.v*dt;if(L.v>0&&o.x>COLS+4)o.x-=P;if(L.v<0&&o.x+o.len<-4)o.x+=P}}
    if(L.train){const T=L.train;
      if(T.state==='idle'){T.t-=dt;if(T.t<=0){T.state='warn';T.t=G.kid?2.4:1.4;if(Math.abs(i-p.row)<8)sDing()}}
      else if(T.state==='warn'){T.t-=dt;T.blink=(T.blink||0)+dt;if(T.t<=0){T.state='go';T.x=T.dir>0?-T.len-1:COLS+1;if(Math.abs(i-p.row)<8)sHorn()}}
      else{T.x+=T.dir*(G.kid?13:22)*dt;if((T.dir>0&&T.x>COLS+1)||(T.dir<0&&T.x+T.len<-1)){T.state='idle';T.t=rand(3,7)*(G.kid?1.6:1)}}}
    if(L.coin)L.coin.phase+=dt*4;
  }
  if(p.invuln>0)p.invuln-=dt;
  if(p.alive){
    if(p.hop){p.hop.t+=dt/.13;
      if(p.hop.t>=1){p.x=p.hop.tx;p.row=p.hop.tr;p.hop=null;land()}}
    if(!p.hop){
      const L=lane(p.row);
      if(L.type==='river'){
        if(L.pads){if(!L.pads.has(Math.round(p.x)))die('splash')}
        else{const log=L.objs.find(o=>p.x+.5>o.x+.05&&p.x+.5<o.x+o.len-.05);
          if(!log)die('splash');else{p.x+=L.v*dt;if(p.x<-.45||p.x>COLS-.55)die('drift')}}
      }
      if(L.type==='road'&&L.objs.some(o=>p.x+.5+.3>o.x+.08&&p.x+.5-.3<o.x+o.len-.08))die('squish');
      if(L.train&&L.train.state==='go'){const T=L.train;if(p.x+.5+.3>T.x&&p.x+.5-.3<T.x+T.len)die('train')}
    }
    // camera
    const target=p.row-3;
    if(G.kid){if(target>G.cam)G.cam+=Math.min(target-G.cam,dt*6)}
    else{
      if(G.started)G.cam+=dt*(.32+Math.min(.65,G.score*.004));
      if(target>G.cam)G.cam+=Math.min(target-G.cam,dt*6);
      if(p.row<G.cam-.55)die('gust');
    }
  }else{G.deathT+=dt;if(G.deathT>.9&&!G.over&&G.deathT-dt<=.9)afterDeath()}
  G.parts=G.parts.filter(q=>(q.life-=dt)>0);for(const q of G.parts){q.x+=q.vx*dt;q.row+=q.vy*dt;q.vy-=9*dt}
  if(G.shake>0)G.shake-=dt;
}

// ================= render (2.5D: lanes recede upward, every object is an extruded block) =================
const cv=$('cv'),ctx=cv.getContext('2d');let C=60,D=48,VIS=14,Wc=0,Hc=0;
function layout(){
  // size the board to exactly the space above the buttons (the canvas must never grow the page)
  const dpr=Math.min(window.devicePixelRatio||1,2),padH=document.querySelector('.pad').offsetHeight;
  Wc=innerWidth;Hc=Math.max(200,innerHeight-padH);cv.style.width=Wc+'px';cv.style.height=Hc+'px';cv.width=Math.round(Wc*dpr);cv.height=Math.round(Hc*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;
  C=Math.floor(Math.min(Wc/COLS,Hc/9));D=Math.round(C*.8);VIS=Math.ceil(Hc/D)+3;
}
addEventListener('resize',()=>{if(G)layout()});
const OX=()=>Math.round((Wc-C*COLS)/2);
const rowY=row=>Hc-(row-G.cam+1)*D-C*.35;     // top edge of a lane strip
function box(x,y,w,h,top,front){ctx.fillStyle=front;ctx.fillRect(x,y+D-h,w,h);ctx.fillStyle=top;ctx.fillRect(x,y-h,w,D)}
function drawLane(L,now){
  const y=rowY(L.i),ox=OX(),W=C*COLS;
  const full=(col,lip)=>{ctx.fillStyle=col;ctx.fillRect(0,y,Wc,D);ctx.fillStyle=lip;ctx.fillRect(0,y+D-Math.max(3,C*.08),Wc,Math.max(3,C*.08))};
  if(L.type==='grass'){full(L.shade?'#8fd16a':'#84c95f','#5f9e3f');
    ctx.fillStyle='#74b852';for(let k=0;k<5;k++){const tx=((L.i*37+k*53)%97)/97*Wc;ctx.fillRect(tx,y+D*.3+(k%2)*D*.3,C*.12,C*.06)}}
  if(L.type==='road'){full('#5b5f68','#3c3f46');
    const nb=lane(L.i+1);if(nb.type==='road'){ctx.fillStyle='#e9e9e0';for(let x=ox;x<ox+W;x+=C)ctx.fillRect(x+C*.25,y-1,C*.5,3)}}
  if(L.type==='rail'){full('#a08c74','#6e5d4a');
    ctx.fillStyle='#6b4a2e';for(let x=ox-C;x<ox+W+C;x+=C*.5)ctx.fillRect(x,y+D*.15,C*.18,D*.7);
    ctx.fillStyle='#c9d0d6';ctx.fillRect(0,y+D*.28,Wc,3);ctx.fillRect(0,y+D*.66,Wc,3);
    const T=L.train,on=T.state==='warn'&&Math.floor(T.blink*6)%2===0;
    box(ox+W+2,y+D*.1,C*.18,C*.9,'#444','#333');ctx.fillStyle=on?'#ff3b30':'#5a1d1a';ctx.fillRect(ox+W-C*.06,y-C*.85,C*.3,C*.3)}
  if(L.type==='river'){ctx.fillStyle='#3b8fd9';ctx.fillRect(0,y,Wc,D);ctx.fillStyle='#2f78bb';ctx.fillRect(0,y+D-C*.1,Wc,C*.1);
    ctx.fillStyle='#7cc3f5';for(let k=0;k<4;k++){const tx=(((L.i*41+k*71)%100)/100*Wc+now/40*(L.dir||1))%Wc;ctx.fillRect((tx+Wc)%Wc,y+D*(.25+.18*k),C*.4,2)}}
  // objects
  if(L.type==='grass'){for(const c of L.trees){const x=ox+c*C;
    box(x+C*.38,y+D*.25,C*.24,C*.3,'#7a4c28','#5e3a1f');box(x+C*.1,y+D*.05,C*.8,C*.95,'#4fae45','#2f7a3e');
    ctx.fillStyle='#6cc95d';ctx.fillRect(x+C*.2,y-C*.9+D*.15,C*.2,C*.12)}}
  if(L.type==='road')for(const o of L.objs){const x=ox+o.x*C+C*.06,w=o.len*C-C*.12;
    box(x,y+D*.12,w,C*.42,shade(o.color,.15),shade(o.color,-.25));
    const cx=o.truck?(L.v>0?x+w*.62:x+w*.05):x+w*.2,cw=o.truck?w*.33:w*.6;
    box(cx,y+D*.18,cw,C*.66,'#dff1ff',shade(o.color,-.35));
    ctx.fillStyle='#9ad3ff';ctx.fillRect(cx+cw*.1,y+D-C*.6,cw*.8,C*.14);
    ctx.fillStyle='#1e1e24';ctx.fillRect(x+w*.12,y+D-C*.08,C*.22,C*.1);ctx.fillRect(x+w*.88-C*.22,y+D-C*.08,C*.22,C*.1)}
  if(L.type==='river'){
    if(L.pads)for(const c of L.pads){const x=ox+c*C;ctx.fillStyle='#2f7a3e';ctx.fillRect(x+C*.08,y+D*.2,C*.84,D*.7);
      ctx.fillStyle='#5cbf4a';ctx.fillRect(x+C*.08,y+D*.1,C*.84,D*.65);ctx.fillStyle='#f49ac1';ctx.fillRect(x+C*.6,y+D*.18,C*.14,C*.14)}
    for(const o of L.objs){const x=ox+o.x*C+C*.04,w=o.len*C-C*.08;box(x,y+D*.12,w,C*.2,'#a5703f','#7a4c28');
      ctx.fillStyle='#c99560';ctx.fillRect(x,y+D*.12-C*.2,C*.16,D);ctx.fillRect(x+w-C*.16,y+D*.12-C*.2,C*.16,D);
      ctx.fillStyle='#8b5a30';for(let k=1;k<o.len;k++)ctx.fillRect(x+k*C,y+D*.25-C*.2,2,D*.5)}}
  if(L.train&&L.train.state==='go'){const T=L.train,x=ox+T.x*C,w=T.len*C;
    box(x,y+D*.05,w,C*1.05,'#e8eef3','#c0392b');ctx.fillStyle='#ffd23f';ctx.fillRect(x,y+D-C*.55,w,C*.1);
    ctx.fillStyle='#9ad3ff';for(let k=0;k<T.len;k+=1.5)ctx.fillRect(x+k*C+C*.3,y+D-C*.95,C*.7,C*.25)}
  if(L.coin){const c=L.coin,x=ox+c.col*C+C/2,bob=Math.sin(c.phase)*C*.06,sw=Math.abs(Math.cos(c.phase*.6));
    const col=c.gem?'#3fbfb0':'#ffd23f',dk=c.gem?'#23867b':'#c48a00',w=C*.36*Math.max(.25,sw);
    ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(x-C*.18,y+D*.55,C*.36,C*.1);
    ctx.fillStyle=dk;ctx.fillRect(x-w/2,y+D*.1-C*.25+bob,w,C*.4);ctx.fillStyle=col;ctx.fillRect(x-w/2+2,y+D*.1-C*.25+bob+2,Math.max(2,w-4),C*.4-6)}
}
function drawPlayer(now){
  const p=G.p,ox=OX();let x=p.x,row=p.row,lift=0;
  if(p.hop){const t=Math.min(1,p.hop.t);x=p.hop.fx+(p.hop.tx-p.hop.fx)*t;row=p.hop.fr+(p.hop.tr-p.hop.fr)*t;lift=Math.sin(t*Math.PI)*C*.35}
  const y=rowY(row)+D*.75,cx=ox+(x+.5)*C;
  if(!p.alive&&p.death==='splash')return;
  if(p.invuln>0&&Math.floor(now/90)%2)return;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(cx-C*.3,y-C*.04,C*.6,C*.12);
  const squash=!p.alive?.35:1;
  drawChar(ctx,sel,cx,y-lift,C*.95,p.face<0,squash);
}
function draw(now){
  if(!G)return;
  ctx.save();if(G.shake>0)ctx.translate(rand(-4,4),rand(-4,4));
  ctx.fillStyle='#3d8f3a';ctx.fillRect(0,0,Wc,Hc);
  const lo=Math.max(0,Math.floor(G.cam)-1),hi=Math.floor(G.cam)+VIS;
  const prow=G.p.hop?Math.max(G.p.hop.fr,G.p.hop.tr):G.p.row;
  for(let i=hi;i>=lo;i--){drawLane(lane(i),now);if(i===prow)drawPlayer(now)}
  for(const q of G.parts){ctx.globalAlpha=Math.min(1,q.life*2);ctx.fillStyle=q.c;const s=C*.1;ctx.fillRect(OX()+q.x*C-s/2,rowY(q.row)+D*.5-s/2,s,s)}
  ctx.globalAlpha=1;ctx.restore();
}
let last=0;function frame(now){const dt=Math.min(.05,(now-(last||now))/1000);last=now;update(dt);draw(now);requestAnimationFrame(frame)}

// ================= input =================
const hold=(el,fn)=>el.addEventListener('pointerdown',e=>{e.preventDefault();fn()});
hold($('bL'),()=>move(-1,0));hold($('bR'),()=>move(1,0));hold($('bU'),()=>move(0,1));
addEventListener('keydown',e=>{if($('game').hidden)return;const k=e.code;
  if(k==='ArrowUp'||k==='KeyW'||k==='Space')move(0,1);else if(k==='ArrowLeft'||k==='KeyA')move(-1,0);else if(k==='ArrowRight'||k==='KeyD')move(1,0);else return;e.preventDefault()});
let sw=null;
cv.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY}});
cv.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,1)});

// ================= screens =================
function show(id){['start','chars','game'].forEach(s=>$(s).hidden=s!==id)}
function startScreen(){
  if(G)G.over=true;G=null;$('over').hidden=true;show('start');
  $('coinsS').textContent=coins;spriteCanvas($('hero'),sel);
  $('bests').textContent=`Best: ${bestReg} lanes · Lincoln mode best: ${bestKid}`;
}
let confirmBuy=-1;
function charsScreen(){
  show('chars');$('coinsC').textContent=coins;const g=$('grid');g.innerHTML='';
  CHARS.forEach((ch,i)=>{const b=document.createElement('button');b.type='button';
    const has=owned.has(i);b.className='card'+(i===sel?' sel':'')+(has?'':' locked');
    const cvs=document.createElement('canvas');spriteCanvas(cvs,i);b.appendChild(cvs);
    const nm=document.createElement('b');nm.textContent=has?ch.name:'???';b.appendChild(nm);
    b.appendChild(document.createTextNode(i===sel?'Playing':has?'Tap to pick':confirmBuy===i?`Buy for ${ch.price}?`:`${ch.price} coins`));
    b.onclick=()=>{
      if(has){sel=i;saveAll();confirmBuy=-1;tone(660,.08,'triangle',.05);charsScreen();return}
      if(coins<ch.price){confirmBuy=-1;b.lastChild.textContent=`Need ${ch.price-coins} more`;tone(200,.15,'square',.04);return}
      if(confirmBuy!==i){confirmBuy=i;charsScreen();return}
      coins-=ch.price;owned.add(i);sel=i;confirmBuy=-1;saveAll();sCoin();charsScreen()};
    g.appendChild(b)});
}
$('playReg').onclick=()=>newGame(false);
$('playKid').onclick=()=>newGame(true);
$('openChars').onclick=()=>{confirmBuy=-1;charsScreen()};
$('charsBack').onclick=startScreen;
$('quit').onclick=startScreen;$('toMenu').onclick=startScreen;
$('again').onclick=()=>{$('over').hidden=true;newGame(G?G.kid:false)};
$('sound').onclick=()=>{soundOn=!soundOn;put('hl-sound',soundOn?'1':'0');if(soundOn)startMusic();else stopMusic();$('sound').textContent='Sound: '+(soundOn?'on':'off')};
$('sound').textContent='Sound: '+(soundOn?'on':'off');
startScreen();requestAnimationFrame(frame);
</script>
